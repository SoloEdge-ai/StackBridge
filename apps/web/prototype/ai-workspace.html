<div id="sb-prototype" aria-label="StackBridge 交互原型">
  <div class="sb-window v-a">
    <header class="sb-titlebar"><span class="sb-brand">S / StackBridge</span><span>Workspace</span><small>交互原型 · 模拟数据 · 不执行命令</small></header>
    <div class="sb-workspace">
      <nav class="sb-rail" aria-label="工作区导航"><button class="cursor-interaction" data-action="terminal" aria-label="终端"><i data-lucide="terminal" aria-hidden="true"></i></button><button class="cursor-interaction" data-action="panel" aria-label="AI 对话"><i data-lucide="sparkles" aria-hidden="true"></i></button></nav>
      <div class="sb-stage panel">
        <section class="sb-terminal" aria-label="模拟终端">
          <div class="sb-tabs"></div><div class="sb-terminal-heading"></div><div class="sb-output"></div>
          <div class="sb-terminal-foot"><span>❯</span><span>终端内容为演示数据</span><button class="cursor-interaction" data-action="quick">Quick Ask · F8</button></div>
          <section class="sb-quick" aria-label="Quick Ask" hidden></section>
        </section>
        <aside class="sb-ai" aria-label="完整 AI 对话"></aside>
      </div>
    </div>
    <div class="sb-state" aria-live="polite"></div>
    <div class="sb-variants" aria-label="原型布局切换"><button class="cursor-interaction" data-action="previous" aria-label="上一种布局">←</button><output class="sb-variant-label"></output><button class="cursor-interaction" data-action="next" aria-label="下一种布局">→</button><small>← → 切换布局 · 状态共享</small></div>
    <dialog class="sb-dialog" aria-label="本条消息的终端内容"></dialog>
  </div>
</div>
<script>
(()=>{
const root=document.getElementById('sb-prototype');
const el=s=>root.querySelector(s);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const layouts=['A · 右侧伴随面板','B · 底部工作台','C · 对话主视图'];
const terminals={remote:{name:'SSH · L001',cwd:'/srv/stackbridge',prompt:'zplea@L001',blocks:[
 {id:'r1',cmd:'pwd',lines:['/srv/stackbridge']},
 {id:'r2',cmd:'docker compose ps',lines:['NAME      STATUS       PORTS','api       Up 2 min     0.0.0.0:8080->8080','db        Up 2 min     5432/tcp']},
 {id:'r3',cmd:'docker compose logs --tail 20 api',lines:['api | Starting server on :8080','api | ERROR connect ECONNREFUSED 127.0.0.1:5432','api | Retrying database connection…']},
 {id:'r4',cmd:'docker compose config --services',lines:['api','db']}
]},local:{name:'本地 · PowerShell',cwd:'C:\\Projects\\StackBridge',prompt:'PS',blocks:[
 {id:'l1',cmd:'Get-Location',lines:['C:\\Projects\\StackBridge']},
 {id:'l2',cmd:'git status -sb',lines:['## main...origin/main','working tree clean']},
 {id:'l3',cmd:'pnpm --version',lines:['10.33.0']}
]}};
let state={variant:0,view:'panel',terminal:'remote',provider:'deepseek',conversation:1,locked:true,width:410,bottom:330,font:14,
 drafts:{remote:'为什么 API 连不上数据库？',local:''},modes:{remote:'auto',local:'auto'},manual:{remote:[],local:[]},sent:{r2:3},pending:null,
 messages:[{role:'user',text:'这台主机上有哪些服务？',source:'SSH · L001',attachments:[{id:'r2',cmd:'docker compose ps',lines:terminals.remote.blocks[1].lines,from:0}]},{role:'assistant',html:'<p>目前有 <strong>api</strong> 和 <strong>db</strong> 两个容器在运行。容器处于 Up 状态，不代表应用已经连上数据库。</p><p>可以继续看 API 日志，确认实际连接地址。</p>'}],notice:'同一对话 · 两个入口'};
let drag=null,timer=null;
const current=()=>terminals[state.terminal];
const mode=()=>state.modes[state.terminal];
const providerLabel=()=>state.provider==='deepseek'?'DeepSeek · deepseek-v4-pro':'ChatGPT · GPT-5.6 Luna';
function attachments(){
 if(state.pending&&state.pending.terminal===state.terminal)return state.pending.attachments;
 if(mode()==='none')return [];
 return current().blocks.filter((b,i)=>mode()==='manual'?state.manual[state.terminal].includes(b.id):i>=current().blocks.length-3&&b.lines.length>(state.sent[b.id]||0)).map(b=>({id:b.id,cmd:b.cmd,from:mode()==='manual'?0:state.sent[b.id]||0,lines:b.lines.slice(mode()==='manual'?0:state.sent[b.id]||0)}));
}
function bytes(){return new TextEncoder().encode(attachments().map(a=>a.cmd+'\n'+a.lines.join('\n')).join('\n')).length;}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'StackBridge',layout:layouts[state.variant],view:state.view,provider:providerLabel(),terminal:current().name,contextMode:mode(),attachmentCount:attachments().length},privateContent:{width:state.width,font:state.font}}).catch(()=>{});}
function restore(snapshot){const s=snapshot?.modelContent;if(!s||s.prototype!=='StackBridge')return;const v=layouts.indexOf(s.layout);if(v>=0)state.variant=v;const p=snapshot.privateContent;if(p?.width>=300&&p.width<=600)state.width=p.width;if(p?.font>=13&&p.font<=17)state.font=p.font;}
restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
function renderTerminal(){
 el('.sb-tabs').innerHTML=Object.entries(terminals).map(([id,t])=>`<button class="cursor-interaction" data-terminal="${id}" aria-pressed="${state.terminal===id}">${escape(t.name)}</button>`).join('');
 el('.sb-terminal-heading').innerHTML=`<strong>● ${escape(current().name)}</strong><span>${escape(current().cwd)}</span><button class="cursor-interaction" data-action="append">＋ 追加模拟输出</button>`;
 const selected=attachments(),ids=selected.map(a=>a.id),first=ids[0],last=ids.at(-1);
 el('.sb-output').innerHTML=current().blocks.map((b,i)=>{const a=selected.find(a=>a.id===b.id);return `<div class="sb-block ${a?'selected':''} ${a&&(a.from||a.lines.length<b.lines.length)?'partial':''}" data-block="${b.id}" data-index="${i}"><label class="sb-command"><input type="checkbox" data-block-check="${b.id}" ${a?'checked':''} ${state.pending?'disabled':''} aria-label="附带 ${escape(b.cmd)}"><code><span class="sb-prompt">❯</span> ${escape(b.cmd)}</code></label><pre>${b.lines.map((line,j)=>`<span class="${a&&j>=a.from&&j<a.from+a.lines.length?'sb-line-new':''}">${escape(line)}</span>`).join('\n')}</pre><span class="sb-block-status">${a?(a.from?'本条附带新增 '+a.lines.length+' 行 · 标题仅作来源':'本条附带 · 命令与输出'):state.sent[b.id]>=b.lines.length?'已发送 · 自动不重复':state.sent[b.id]?'有新增输出 · 未附带':'未附带'}</span>${a&&b.id===first&&!state.pending?'<button class="sb-handle start" data-drag="start" aria-label="拖动扩大上下文起点"></button>':''}${a&&b.id===last&&!state.pending?'<button class="sb-handle end" data-drag="end" aria-label="拖动扩大上下文终点"></button>':''}</div>`}).join('')+`<div class="sb-muted"><code>${escape(current().prompt)} ${escape(current().cwd)} ❯ ▌</code></div>`;
}
function route(){return `<div class="sb-route"><select aria-label="提供方与模型" data-provider ${state.locked||state.pending?'disabled':''}><option value="deepseek" ${state.provider==='deepseek'?'selected':''}>DeepSeek · deepseek-v4-pro</option><option value="chatgpt" ${state.provider==='chatgpt'?'selected':''}>ChatGPT · GPT-5.6 Luna</option></select><span>${state.locked?'🔒':'可切换'}</span><button class="cursor-interaction" data-action="new" ${state.pending?'disabled':''}>＋ 新对话</button></div>`;}
function composer(){const a=attachments();return `<div class="sb-compose"><div class="sb-context-line"><button class="cursor-interaction" data-action="context">终端内容 ×${a.length}</button><span>${mode()==='auto'?'自动增量':mode()==='manual'?'手动选择':'不附带终端'}</span><span>${escape(current().name)} · ${(bytes()/1024).toFixed(1)} KiB</span></div>${a.length?`<div class="sb-chips">${a.map(x=>`<button class="cursor-interaction" data-remove="${x.id}" aria-label="移除 ${escape(x.cmd)}" ${state.pending?'disabled':''}>${escape(x.cmd)} ×</button>`).join('')}</div>`:''}<textarea aria-label="提问" placeholder="询问当前终端…" rows="2" ${state.pending?'disabled':''}>${escape(state.drafts[state.terminal])}</textarea><div class="sb-send-row"><small>发送至 ${state.provider==='deepseek'?'DeepSeek':'ChatGPT'}${!a.length?' · 已有对话历史保留':''}</small><button class="sb-send cursor-interaction" data-action="${state.pending?'stop':'send'}" ${!state.pending&&!state.drafts[state.terminal].trim()?'disabled':''}>${state.pending?'停止':'发送 ↑'}</button></div></div>`;}
function renderMessages(){return state.messages.map(m=>`<div class="sb-message ${m.role}"><div class="sb-author">${m.role==='user'?'你 · '+escape(m.source):'StackBridge AI'}</div>${m.role==='user'?escape(m.text):m.html}${m.attachments?.length?`<details><summary>本条附带 ${m.attachments.length} 段终端内容</summary>${m.attachments.map(a=>`<pre>${escape(a.cmd+'\n'+a.lines.join('\n'))}</pre>`).join('')}</details>`:''}</div>`).join('')+(state.pending?'<div class="sb-message"><small>正在模拟 AI 回复… · 本轮附件已冻结</small></div>':'');}
function renderDialog(){if(!el('.sb-dialog').open)return;const a=attachments();el('.sb-dialog').innerHTML=`<div class="sb-dialog-head"><h3>本条消息的终端内容</h3><button class="cursor-interaction" data-action="close-context" aria-label="关闭上下文选择">×</button></div><div class="sb-dialog-content"><label>上下文模式<select class="sb-mode" aria-label="上下文模式" data-mode ${state.pending?'disabled':''}><option value="auto" ${mode()==='auto'?'selected':''}>自动：最近 3 块中的新增输出</option><option value="manual" ${mode()==='manual'?'selected':''}>手动：仅选中的完整命令块</option><option value="none" ${mode()==='none'?'selected':''}>不附带终端内容</option></select></label><small>${mode()==='none'?'已有对话历史仍保留；本条消息不附带新的终端内容。':mode()==='auto'?'高亮只表示本条待发送内容；成功发送后自动排除。':'可重新附带已发送的完整命令块。'}</small>${current().blocks.map(b=>`<div class="sb-dialog-command"><label><input type="checkbox" data-block-check="${b.id}" aria-label="选择 ${escape(b.cmd)}" ${a.some(x=>x.id===b.id)?'checked':''} ${state.pending?'disabled':''}><code>${escape(b.cmd)}</code></label><pre>${escape(b.lines.join('\n'))}</pre></div>`).join('')}</div><div class="sb-dialog-footer"><small>${escape(current().name)} · ${a.length} 段 · ${(bytes()/1024).toFixed(1)} KiB</small><button class="sb-send cursor-interaction" data-action="close-context">完成</button></div>`;}
function render(){
 const win=el('.sb-window');win.className='sb-window v-'+['a','b','c'][state.variant];root.style.setProperty('--sb-width',state.width+'px');root.style.setProperty('--sb-bottom',state.bottom+'px');root.style.fontSize=state.font+'px';
 el('.sb-stage').className='sb-stage '+state.view;el('.sb-ai').hidden=state.view!=='panel';el('.sb-quick').hidden=state.view!=='quick';
 root.querySelectorAll('.sb-rail button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===state.view)));
 renderTerminal();
 if(state.view==='panel')el('.sb-ai').innerHTML=`<button class="sb-divider" data-drag="panel" aria-label="调整 AI 面板大小"></button><div class="sb-ai-head"><div class="sb-ai-title"><h2>AI 对话</h2><button class="cursor-interaction" data-action="quick">↙ Quick Ask</button></div>${route()}</div><div class="sb-messages">${renderMessages()}</div>${composer()}`;
 else el('.sb-ai').innerHTML='';
 if(state.view==='quick'){const latest=[...state.messages].reverse().find(m=>m.role==='assistant');el('.sb-quick').innerHTML=`<div class="sb-quick-head" data-drag="quick"><span>⠿ Quick Ask</span><button class="cursor-interaction" data-action="panel">展开对话 ↗</button><button class="cursor-interaction" data-action="follow" aria-label="返回光标旁">归位</button><button class="cursor-interaction" data-action="terminal" aria-label="关闭 Quick Ask">×</button></div>${route()}${composer()}${latest?`<div class="sb-short-answer"><div class="sb-excerpt">${latest.html.replace(/<div class="sb-proposal">[\s\S]*/, '').replace(/<pre>[\s\S]*/, '')}</div><button class="cursor-interaction" data-action="panel">阅读完整回复 ↗</button></div>`:''}`;}else el('.sb-quick').innerHTML='';
 el('.sb-state').innerHTML=`<span>${escape(state.notice)}</span><span>会话 ${state.conversation} · ${state.messages.filter(m=>m.role==='user').length} 轮</span><span>待附带 ${attachments().length} 段 · ${Object.keys(state.sent).length} 块已成功发送</span>`;
 el('.sb-variant-label').textContent=layouts[state.variant];renderDialog();
 if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});
}
function showLatest(){requestAnimationFrame(()=>{const list=el('.sb-messages');if(list)list.scrollTop=list.scrollHeight;const output=el('.sb-output');output.scrollTop=output.scrollHeight;});}
function selectBlock(id,checked){if(state.pending)return;let ids=attachments().map(a=>a.id);state.modes[state.terminal]='manual';state.manual[state.terminal]=checked?[...new Set([...ids,id])]:ids.filter(x=>x!==id);state.notice='本条消息 · 手动选择';render();save();}
function changeView(view){state.view=view;state.notice='同一会话 · 草稿与附件保持不变';render();showLatest();save();}
function reply(){const p=state.pending;if(!p)return;for(const a of p.attachments)state.sent[a.id]=Math.max(state.sent[a.id]||0,a.from+a.lines.length);state.pending=null;const noTerminal=!p.attachments.length;
 const html=noTerminal?'<p>继续沿用这段对话的历史。<strong>这次没有新增终端附件</strong>，所以不能据此确认服务的最新状态。</p><p>如果已经修改了配置，可以附带新的日志，我再协助判断。</p>':p.terminal==='remote'?'<p>日志里的关键是 <code>127.0.0.1:5432</code>。在 API 容器中，这个地址指向 <strong>API 容器自身</strong>，不是数据库容器。</p><p>下一步先检查连接主机是否应为 Compose 服务名 <code>db</code>，并确认两者处于同一网络。仅凭这份日志，还不能确定数据库是否已经就绪。</p><div class="sb-proposal"><small>命令建议 · 固定来源 SSH / L001</small><pre><code>docker compose logs --tail 20 db</code></pre><button class="cursor-interaction" data-action="approve">模拟批准并查看输出</button><small>原型不会连接 SSH 或真正执行命令</small></div>':'<p>本地工作树没有未提交改动，pnpm 版本为 <code>10.33.0</code>。本轮来源已切换为 <strong>本地 PowerShell</strong>，之前 SSH 上的分析仍留在同一对话中。</p>';
 state.messages.push({role:'assistant',html});state.notice='模拟发送成功 · 下轮只附带新增内容';render();showLatest();save();}
function send(){if(state.pending||!state.drafts[state.terminal].trim())return;const frozen=attachments().map(a=>({...a,lines:[...a.lines]}));const text=state.drafts[state.terminal].trim();state.pending={terminal:state.terminal,attachments:frozen,text};state.messages.push({role:'user',text,source:current().name,attachments:frozen});state.drafts[state.terminal]='';state.locked=true;state.notice='模拟请求进行中 · 范围冻结';render();showLatest();timer=setTimeout(reply,1600);save();}
function variant(delta){state.variant=(state.variant+delta+3)%3;state.view='panel';state.notice='仅改变布局 · 会话状态未改变';render();showLatest();save();}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.terminal){state.terminal=b.dataset.terminal;state.notice='跨终端延续同一 AI 对话';render();showLatest();save();return;}
 if(b.dataset.remove){selectBlock(b.dataset.remove,false);return;}
 const action=b.dataset.action;
 if(['quick','panel','terminal'].includes(action)){changeView(action);return;}
 if(action==='send')send();
 if(action==='stop'){clearTimeout(timer);const p=state.pending;if(p){state.drafts[p.terminal]=p.text;state.messages.pop();}state.pending=null;state.notice='已取消 · 未推进去重记录';render();save();}
 if(action==='new'&&!state.pending){state.conversation++;state.sent={};state.messages=[];state.locked=false;state.notice='新对话 · 提供方与模型可切换';render();save();}
 if(action==='context'){el('.sb-dialog').showModal();renderDialog();el('.sb-dialog button')?.focus();}
 if(action==='close-context')el('.sb-dialog').close();
 if(action==='previous')variant(-1);if(action==='next')variant(1);
 if(action==='append'){let block=current().blocks.find(b=>b.id===(state.terminal==='remote'?'r3':'lbuild'));if(!block){block={id:'lbuild',cmd:'pnpm build --watch',lines:[]};current().blocks.push(block);}block.lines.push(`[${block.lines.length+1}] ${state.terminal==='remote'?'api | Retry: database connection refused':'Build check finished'}`);state.notice='新增模拟输出 · 下一轮自动增量';render();save();}
 if(action==='follow'){const q=el('.sb-quick');q.style.left='';q.style.top='';q.style.bottom='';q.style.width='';q.style.height='';state.notice='Quick Ask 已归位';el('.sb-state').firstElementChild.textContent=state.notice;}
 if(action==='approve'){terminals.remote.blocks.push({id:'r'+Date.now(),cmd:'docker compose logs --tail 20 db',lines:['db | database system is ready to accept connections']});state.terminal='remote';state.notice='仅模拟批准 · 未执行真实命令';render();showLatest();save();}
});
root.addEventListener('change',event=>{const target=event.target;if(target.matches('[data-block-check]'))selectBlock(target.dataset.blockCheck,target.checked);if(target.matches('[data-mode]')){state.modes[state.terminal]=target.value;state.notice=target.value==='none'?'不附带新终端内容 · 历史仍保留':'本条附件已更新';render();save();}if(target.matches('[data-provider]')&&!state.locked){state.provider=target.value;render();save();}});
root.addEventListener('input',event=>{if(event.target.matches('textarea')){state.drafts[state.terminal]=event.target.value;const sendButton=root.querySelector('[data-action="send"]');if(sendButton)sendButton.disabled=!event.target.value.trim();}});
root.addEventListener('keydown',event=>{if(event.isComposing)return;if(el('.sb-dialog').open)return;
 if(event.key==='F8'){event.preventDefault();changeView(state.view==='quick'?'terminal':'quick');return;}
 if(event.key==='Escape'){event.preventDefault();changeView('terminal');return;}
 if(event.target.matches('textarea')){if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}return;}
 if(event.target.matches('input,select,[contenteditable]'))return;
 if(event.target.dataset.drag==='panel'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();state.width=Math.max(300,Math.min(600,state.width+(event.key==='ArrowLeft'?20:-20)));state.bottom=Math.max(250,Math.min(450,state.bottom+(event.key==='ArrowUp'?20:-20)));root.style.setProperty('--sb-width',state.width+'px');root.style.setProperty('--sb-bottom',state.bottom+'px');save();return;}
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();variant(event.key==='ArrowLeft'?-1:1);}
});
root.addEventListener('mousedown',event=>{const handle=event.target.closest('[data-drag]');if(!handle||event.target.closest('[data-action]'))return;event.preventDefault();const ids=attachments().map(a=>a.id),blocks=current().blocks;const rect=el('.sb-quick').getBoundingClientRect();drag={type:handle.dataset.drag,x:event.clientX,y:event.clientY,width:state.width,bottom:state.bottom,left:rect.left,top:rect.top,start:blocks.findIndex(b=>b.id===ids[0]),end:blocks.findIndex(b=>b.id===ids.at(-1))};el('.sb-state').firstElementChild.textContent='正在拖动 · 松开确认';});
document.addEventListener('mousemove',event=>{if(!drag)return;
 if(drag.type==='panel'){if(state.variant===1||root.clientWidth<=760){state.bottom=Math.max(250,Math.min(450,drag.bottom+drag.y-event.clientY));root.style.setProperty('--sb-bottom',state.bottom+'px');}else{state.width=Math.max(300,Math.min(600,drag.width+drag.x-event.clientX));root.style.setProperty('--sb-width',state.width+'px');}return;}
 if(drag.type==='quick'){const box=el('.sb-terminal').getBoundingClientRect(),q=el('.sb-quick');q.style.left=Math.max(7,Math.min(box.width-q.offsetWidth-7,drag.left-box.left+event.clientX-drag.x))+'px';q.style.top=Math.max(7,Math.min(box.height-q.offsetHeight-7,drag.top-box.top+event.clientY-drag.y))+'px';q.style.bottom='auto';return;}
 if(state.pending)return;const nodes=[...root.querySelectorAll('.sb-output [data-block]')];let index=nodes.findIndex(n=>event.clientY<n.getBoundingClientRect().bottom);if(index<0)index=nodes.length-1;const start=drag.type==='start'?Math.min(index,drag.end):drag.start,end=drag.type==='end'?Math.max(index,drag.start):drag.end;state.modes[state.terminal]='manual';state.manual[state.terminal]=current().blocks.slice(start,end+1).map(b=>b.id);state.notice='拖动选中完整命令块 · 手动模式';renderTerminal();
});
document.addEventListener('mouseup',()=>{if(!drag)return;const type=drag.type;drag=null;if(type==='start'||type==='end')render();else el('.sb-state').firstElementChild.textContent='布局已调整 · 对话和附件未改变';save();});window.addEventListener('blur',()=>{drag=null;});
render();showLatest();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();showLatest();}});tweak.addSlider(state,'font',{label:'正文字号',min:13,max:17,step:1,unit:'px'});tweak.addSlider(state,'width',{label:'侧面板宽度',min:300,max:600,step:10,unit:'px'});}
})();
</script>
